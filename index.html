<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' https://www.googletagmanager.com; style-src 'self'; img-src 'self' data: https://*.google-analytics.com; connect-src 'self' https://*.google-analytics.com https://www.googletagmanager.com; object-src 'none'; base-uri 'none'; form-action 'none'">
  <title>桥牌会员积分查询</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="style.css">
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-B8DV6CYRSK"></script>
  <script src="analytics.js"></script>
  <script src="app.js" defer></script>
</head>
<body>
  <a class="skip-link" href="#main">跳到主要内容</a>
  <header class="site-header">
    <div class="header-inner">
      <div class="brand-mark" aria-hidden="true">♠</div>
      <div>
        <p class="eyebrow">BRIDGE RECORDS</p>
        <h1 id="site-title">桥牌会员积分查询</h1>
        <p id="site-subtitle" class="subtitle">公开积分排名与个人参赛记录</p>
      </div>
    </div>
  </header>

  <main id="main" class="page-shell">
    <section id="rankings-panel" class="panel tab-panel">
      <div class="panel-heading">
        <div>
          <p class="section-kicker">PUBLIC RANKINGS</p>
          <h2>公开积分榜</h2>
          <p id="public-description" class="muted"></p>
        </div>
        <div id="updated-at" class="updated-at"></div>
      </div>

      <div class="ranking-controls">
        <div class="sort-control">
          <span>排序方式</span>
          <div class="segmented" role="group" aria-label="选择排行榜排序方式">
            <button class="segment is-active" data-ranking="master_points" type="button">按大师分</button>
            <button class="segment" data-ranking="rating_points" type="button">按等级分</button>
          </div>
        </div>
        <label class="search-box">
          <span class="sr-only">搜索姓名或会员号</span>
          <input id="ranking-search" type="search" placeholder="搜索姓名或会员号" autocomplete="off">
        </label>
      </div>

      <div class="table-wrap">
        <table class="data-table ranking-table">
          <thead>
            <tr>
              <th>排名</th><th>姓名</th><th>会员号</th><th>称号</th>
              <th id="master-heading">大师分</th><th id="rating-heading">等级分</th>
            </tr>
          </thead>
          <tbody id="ranking-body"></tbody>
        </table>
      </div>
      <p id="ranking-empty" class="empty-state" hidden>没有匹配的会员。</p>
    </section>

    <section id="private-panel" class="panel tab-panel" hidden>
      <div class="panel-heading">
        <div>
          <p class="section-kicker">PRIVATE RECORDS</p>
          <h2>个人参赛记录</h2>
        </div>
        <button id="back-to-rankings" class="ghost-button" type="button">返回公开排行榜</button>
      </div>
      <p id="private-status" class="status-message" role="status" aria-live="polite">正在读取个人记录…</p>

      <div id="private-content" hidden>
        <div class="member-banner">
          <div>
            <p class="section-kicker">MEMBER</p>
            <div class="member-name-line">
              <h3 id="member-name"></h3>
              <strong id="member-title" class="member-title"></strong>
            </div>
            <p id="member-meta" class="muted"></p>
          </div>
        </div>

        <div class="stat-grid">
          <article>
            <span>大师分</span><strong id="stat-master"></strong>
            <small id="stat-master-rank"></small>
          </article>
          <article>
            <span>等级分</span><strong id="stat-rating"></strong>
            <small id="stat-rating-rank"></small>
          </article>
          <article>
            <span>参赛次数</span><strong id="stat-count"></strong>
            <small id="stat-count-rank"></small>
          </article>
        </div>

        <div class="content-section">
          <div class="section-row">
            <div><p class="section-kicker">TOURNAMENTS</p><h3>参赛明细</h3></div>
            <input id="record-search" class="compact-search" type="search" placeholder="筛选赛事、主办方或类别">
          </div>
          <div id="record-cards" class="record-cards"></div>
          <p id="record-empty" class="empty-state" hidden>没有匹配的参赛记录。</p>
        </div>

        <div class="content-section">
          <div class="section-row"><div><p class="section-kicker">LEVEL HISTORY</p><h3>等级变化</h3></div></div>
          <div class="table-wrap">
            <table class="data-table">
              <thead><tr><th>日期</th><th>原等级</th><th>新等级</th><th>赛事</th><th>主办方</th></tr></thead>
              <tbody id="level-body"></tbody>
            </table>
          </div>
          <p id="level-empty" class="empty-state" hidden>暂无等级变化记录。</p>
        </div>
      </div>
    </section>
  </main>

  <footer><p id="footer-text"></p></footer>
</body>
</html>
